<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>MiguelAngelus — Arcanjo Miguel</title>
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23508f"/>
      <stop offset="1" stop-color="#0e1f40"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.36" r="0.5">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e6ff"/>
    </linearGradient>
    <linearGradient id="capa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0473a"/>
      <stop offset="1" stop-color="#a82a20"/>
    </linearGradient>
    <linearGradient id="tunica" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f95ec"/>
      <stop offset="1" stop-color="#2d6cc4"/>
    </linearGradient>
    <clipPath id="moldura"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#moldura)">
    <!-- céu -->
    <rect width="512" height="512" fill="url(#ceu)"/>
    <circle cx="256" cy="200" r="230" fill="url(#brilho)"/>

    <!-- estrelinhas -->
    <g fill="#ffd95a">
      <path d="M78 92 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
      <path d="M432 70 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
      <path d="M446 250 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
      <path d="M58 268 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    </g>

    <!-- asas -->
    <g stroke="#a9c3ea" stroke-width="5" stroke-linejoin="round" fill="url(#asa)">
      <path id="asaEsq" d="M206 262 C150 214 92 212 52 250 C66 258 76 268 80 280 C62 290 54 304 54 320 C78 312 96 314 108 324 C98 340 98 356 104 370 C128 350 150 340 176 338 C188 316 200 292 212 276 Z"/>
      <path d="M306 262 C362 214 420 212 460 250 C446 258 436 268 432 280 C450 290 458 304 458 320 C434 312 416 314 404 324 C414 340 414 356 408 370 C384 350 362 340 336 338 C324 316 312 292 300 276 Z"/>
    </g>
    <g stroke="#a9c3ea" stroke-width="4" stroke-linecap="round" fill="none">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Secretaria MiguelAngelus</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#f0a000"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.36" r="0.5">
      <stop offset="0" stop-color="#fffbe6" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fffbe6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fde9e2"/>
    </linearGradient>
    <linearGradient id="capa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0473a"/>
      <stop offset="1" stop-color="#a82a20"/>
    </linearGradient>
    <linearGradient id="tunica" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f95ec"/>
      <stop offset="1" stop-color="#2d6cc4"/>
    </linearGradient>
    <clipPath id="moldura"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#moldura)">
    <rect width="512" height="512" fill="url(#fundo)"/>
    <circle cx="256" cy="200" r="240" fill="url(#brilho)"/>

    <!-- raios suaves -->
    <g stroke="#fff3b0" stroke-width="10" stroke-linecap="round" opacity=".55" fill="none">
      <path d="M70 120 l40 26"/><path d="M48 196 l46 8"/><path d="M442 120 l-40 26"/><path d="M464 196 l-46 8"/>
    </g>

    <!-- asas -->
    <g stroke="#d9a7a0" stroke-width="5" stroke-linejoin="round" fill="url(#asa)">
      <path d="M206 262 C150 214 92 212 52 250 C66 258 76 268 80 280 C62 290 54 304 54 320 C78 312 96 314 108 324 C98 340 98 356 104 370 C128 350 150 340 176 338 C188 316 200 292 212 276 Z"/>
      <path d="M306 262 C362 214 420 212 460 250 C446 258 436 268 432 280 C450 290 458 304 458 320 C434 312 416 314 404 324 C414 340 414 356 408 370 C384 350 362 340 336 338 C324 316 312 292 300 276 Z"/>
    </g>
    <g stroke="#d9a7a0" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M90 262 C124 266 156 280 186 300"/><path d="M92 306 C124 306 152 316 180 328"/>
      <path d="M422 262 C388 266 356 280 326 300"/><path d="M420 306 C388 306 360 316 332 328"/>
    </g>

    <!-- capa e túnica -->
    <path d="M188 250 L128 530 L384 530 L324 250 Z" fill="url(#capa)"/>
    <path d="M200 252 Q256 232 312 252 L352 530 L160 530 Z" fill="url(#tunica)"/>
    <path d="M226 246 Q256 272 286 246" fill="none" stroke="#ffd95a" stroke-width="7" stroke-linecap="round"/>
    <rect x="178" y="438" width="156" height="18" rx="6" fill="#f2b632"/>

    <!-- braços -->
    <path d="M204 262 C176 292 168 336 186 368" fill="none" stroke="#2d6cc4" stroke-width="30" stroke-linecap="round"/>
    <path d="M308 262 C336 292 344 336 326 368" fill="none" stroke="#2d6cc4" stroke-width="30" stroke-linecap="round"/>

    <!-- calendário / agenda -->
    <g transform="rotate(-5 256 350)">
      <rect x="180" y="290" width="152" height="132" rx="14" fill="#7a3b12"/>
      <rect x="186" y="296" width="140" height="120" rx="10" fill="#ffffff"/>
      <path d="M186 306 a10 10 0 0 1 10 -10 h120 a10 10 0 0 1 10 10 v24 h-140 z" fill="#c8102e"/>
      <g fill="#7a3b12"><rect x="210" y="282" width="10" height="26" rx="5"/><rect x="292" y="282" width="10" height="26" rx="5"/></g>
      <g fill="#c9d6ea">
        <rect x="198" y="342" width="22" height="16" rx="3"/><rect x="226" y="342" width="22" height="16" rx="3"/>
        <rect x="254" y="342" width="22" height="16" rx="3"/><rect x="282" y="342" width="22" height="16" rx="3"/>
        <rect x="198" y="364" width="22" height="16" rx="3"/><rect x="226" y="364" width="22" height="16" rx="3"/>
        <rect x="282" y="364" width="22" height="16" rx="3"/>
        <rect x="198" y="386" width="22" height="16" rx="3"/><rect x="226" y="386" width="22" height="16" rx="3"/>
        <rect x="254" y="386" width="22" height="16" rx="3"/>
      </g>
      <rect x="254" y="364" width="22" height="16" rx="3" fill="#f0a000"/>
      <path d="M259 372 l5 5 9 -10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- mãos -->
    <circle cx="186" cy="372" r="16" fill="#f6c9a0"/>
    <circle cx="326" cy="364" r="16" fill="#f6c9a0"/>

    <!-- cabeça -->
    <rect x="240" y="226" width="32" height="28" rx="10" fill="#e9b88c"/>
    <circle cx="256" cy="186" r="60" fill="#f6c9a0"/>
    <circle cx="197" cy="194" r="11" fill="#f0bd92"/>
    <circle cx="315" cy="194" r="11" fill="#f0bd92"/>
    <path d="M196 188 C188 146 214 118 256 118 C298 118 324 146 316 188 C308 172 298 162 286 158 C280 170 262 172 250 162 C240 172 222 172 214 160 C204 166 198 176 196 188 Z" fill="#8a5a2b"/>
    <g fill="#8a5a2b">
      <circle cx="206" cy="150" r="16"/><circle cx="230" cy="130" r="18"/><circle cx="258" cy="122" r="18"/>
      <circle cx="286" cy="130" r="18"/><circle cx="306" cy="150" r="16"/>
    </g>
    <ellipse cx="234" cy="194" rx="8" ry="10" fill="#2b1d16"/>
    <ellipse cx="278" cy="194" rx="8" ry="10" fill="#2b1d16"/>
    <circle cx="237" cy="190" r="3" fill="#fff"/>
    <circle cx="281" cy="190" r="3" fill="#fff"/>
    <circle cx="218" cy="214" r="10" fill="#f28b8b" opacity=".45"/>
    <circle cx="294" cy="214" r="10" fill="#f28b8b" opacity=".45"/>
    <path d="M238 220 Q256 238 274 220" fill="none" stroke="#7a3b2e" stroke-width="5" stroke-linecap="round"/>

    <!-- auréola (contorno escuro para aparecer no amarelo) -->
    <ellipse cx="256" cy="96" rx="66" ry="17" fill="none" stroke="#a86b00" stroke-width="16"/>
    <ellipse cx="256" cy="96" rx="66" ry="17" fill="none" stroke="#fff3b8" stroke-width="9"/>

    <!-- selo: avisos (megafone) -->
    <circle cx="420" cy="420" r="52" fill="#ffffff"/>
    <circle cx="420" cy="420" r="44" fill="#1f4f8f"/>
    <g fill="#ffffff">
      <path d="M394 408 h12 l30 -18 v60 l-30 -18 h-12 a6 6 0 0 1 -6 -6 v-12 a6 6 0 0 1 6 -6 z"/>
      <path d="M402 434 h12 l6 22 h-12 z"/>
    </g>
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M446 406 q8 14 0 28"/>
    </g>
  </g>
</svg>
